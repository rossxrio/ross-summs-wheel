<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summs Wheel Settings</title>
  </head>
  <body>
    <main class="card">
      <header data-tauri-drag-region>
        <span class="eyebrow" data-tauri-drag-region>Wheel hotkey</span>
        <button class="close" id="close" aria-label="Close">&times;</button>
      </header>

      <button class="hotkey" id="hotkey" title="Click to change"></button>

      <section class="binds">
        <div class="section-head">
          <span class="eyebrow">Quick binds</span>
          <button class="add" id="add">+ Add</button>
        </div>
        <p class="sub" id="binds-sub"></p>
        <ul class="bind-list" id="binds"></ul>
      </section>

      <section class="voice">
        <div class="section-head">
          <span class="eyebrow">Voice commands</span>
          <label class="switch" title="Hold a key and say “ADC no flash”">
            <input type="checkbox" id="voice-on" />
            <span class="track"></span>
          </label>
        </div>
        <div class="voice-grid" id="voice-body">
          <span class="label">Talk key</span>
          <button
            class="keys talk-key"
            id="voice-key"
            title="Click to change. It still reaches the game (and Discord)"
          ></button>
          <span class="label">Model</span>
          <div class="model-row">
            <select id="voice-model" aria-label="Voice model"></select>
            <button class="small" id="voice-download"></button>
          </div>
        </div>
        <div class="voice-test-row">
          <button class="test" id="voice-test">Hold to test</button>
          <span class="sub" id="voice-sub"></span>
        </div>
      </section>

      <footer>
        <span class="status" id="status"></span>
        <button class="save" id="save" disabled>Save</button>
      </footer>

      <nav class="app-actions">
        <button class="app-action" id="overlay-toggle" aria-pressed="false"></button>
        <button class="app-action quit" id="quit">Quit Summs Wheel</button>
      </nav>
    </main>
    <script type="module" src="/src/settings/main.ts"></script>
  </body>
</html>
