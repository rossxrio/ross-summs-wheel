<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summs Wheel Settings</title>
  </head>
  <body>
    <main class="card">
      <header data-tauri-drag-region>
        <span class="eyebrow" data-tauri-drag-region>Wheel hotkey</span>
        <button class="close" id="close" aria-label="Close">&times;</button>
      </header>

      <button class="hotkey" id="hotkey" title="Click to change"></button>

      <section class="binds">
        <div class="section-head">
          <span class="eyebrow">Quick binds</span>
          <button class="add" id="add">+ Add</button>
        </div>
        <p class="sub" id="binds-sub"></p>
        <ul class="bind-list" id="binds"></ul>
      </section>

      <footer>
        <span class="status" id="status"></span>
        <button class="save" id="save" disabled>Save</button>
      </footer>

      <nav class="app-actions">
        <button class="app-action" id="overlay-toggle" aria-pressed="false"></button>
        <button class="app-action quit" id="quit">Quit Summs Wheel</button>
      </nav>
    </main>
    <script type="module" src="/src/settings/main.ts"></script>
  </body>
</html>
