[package]
name = "summs-wheel"
version = "0.1.0"
description = "GTA-style radial wheel for tracking enemy summoner spells in League of Legends"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default TLS is native-tls (SChannel on Windows): no extra C toolchain needed.
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time"] }

# Telling Right Shift from Left Shift for the settings shortcut (already in the tree via tauri).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
