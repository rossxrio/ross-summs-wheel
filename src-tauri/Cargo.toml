[package]
name = "summs-wheel"
version = "2.0.0-beta"
description = "GTA-style radial wheel for tracking enemy summoner spells in League of Legends"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default TLS is native-tls (SChannel on Windows): no extra C toolchain needed.
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time"] }
whisper-rs = "0.16"
cpal = "0.18"
sha2 = "0.10"

# Backup hotkey sources (key_watch/windows.rs): keyboard hook, Raw Input, polling.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
hound = "3"

